- name: Set up Java JDK 17
  id: setup-java
  uses: actions/setup-java@v4
  with:
    distribution: 'temurin'
    java-version: '17'

- name: Set up Node.js 20
  uses: actions/setup-node@v4
  with:
    node-version: '20'
    cache: 'npm'

- name: Cache npm
  uses: actions/cache@v4
  with:
    path: ~/.npm
    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    restore-keys: |
      ${{ runner.os }}-node-

- name: Install dependencies
  run: npm ci

- name: Build Web App (Vite)
  run: npm run build

- name: Cache Gradle
  uses: actions/cache@v4
  with:
    path: |
      ~/.gradle/caches
      ~/.gradle/wrapper
    key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/gradle/wrapper/gradle-wrapper.properties') }}
    restore-keys: |
      ${{ runner.os }}-gradle-

- name: Install Android commandline tools and SDK (platform-tools, build-tools, platform)
  run: |
    set -e
    mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    cd $ANDROID_SDK_ROOT
    # Download command line tools (versioned archive from Google). If this link becomes invalid, replace with latest commandlinetools zip from Google.
    curl -sSLo commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
    unzip -q commandlinetools.zip -d cmdline-tools-temp
    mkdir -p cmdline-tools/latest
    mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
    rm -rf commandlinetools.zip cmdline-tools-temp
    export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"
    yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses
  shell: bash

- name: Verify Android SDK
  run: |
    echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
    ls -la $ANDROID_SDK_ROOT
    sdkmanager --list --sdk_root=${ANDROID_SDK_ROOT}
  shell: bash

- name: Setup Capacitor and Android Platform
  run: |
    set -e
    npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
    if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
      npx cap init TradeSpark com.tradespark.app --web-dir dist
    fi
    if [ ! -d "android" ]; then
      npx cap add android
    fi
    npx cap sync android
  shell: bash

- name: Grant execute permission for gradlew
  run: |
    set -e
    if [ -f android/gradlew ]; then
      chmod +x android/gradlew
    elif [ -f gradlew ]; then
      chmod +x gradlew
    fi
  shell: bash

- name: Build Android Debug APK
  run: |
    set -e
    if [ -d android ]; then
      cd android
      ./gradlew assembleDebug --no-daemon --stacktrace
    else
      ./gradlew assembleDebug --no-daemon --stacktrace
    fi
  shell: bash

- name: Verify Generated APK
  run: |
    echo "=== Generated APK Files ==="
    find android -type f -name "*.apk" -ls || true
  shell: bash

- name: Upload Debug APK
  uses: actions/upload-artifact@v4
  with:
    name: TradeSpark-Debug-APK
    path: |
      android/app/build/outputs/apk/debug/*.apk
      app/build/outputs/apk/debug/*.apk
    if-no-files-found: error
name: Build Android APK
​on:
push:
branches:
- main
- master
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
​# আপনার প্রজেক্ট যদি React Native / Node.js ভিত্তিক হয় তবে নিচের ধাপগুলো কার্যকর হবে
- name: Set up Node.js
uses: actions/setup-node@v4
with:
node-version: '18'
​- name: Install Dependencies
run: |
if [ -f package.json ]; then
npm install
fi
​# Android Gradle Executable Permission
- name: Grant Execute Permission for Gradlew
run: |
if [ -f android/gradlew ]; then
chmod +x android/gradlew
elif [ -f gradlew ]; then
chmod +x gradlew
fi
​# Debug APK Build Step
- name: Build Android Debug APK
run: |
if [ -d android ]; then
cd android && ./gradlew assembleDebug
elif [ -f gradlew ]; then
./gradlew assembleDebug
else
echo "No Gradle wrapper found. Please ensure your repository has Android Gradle configuration."
exit 1
fi
​# Generated APK ফাইল আর্টিফ্যাক্ট হিসেবে ডাউনলোড করার অপশন
- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: TradeSpark-SPARK-Debug-APK
path: |
/build/outputs/apk/debug/.apk
/build/outputs/apk/release/.apk

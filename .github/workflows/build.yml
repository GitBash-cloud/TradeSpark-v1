name: Build TradeSpark APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm deps
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android commandline tools and SDK
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          curl -sSLo commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q commandlinetools.zip -d cmdline-tools-temp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
          rm -rf commandlinetools.zip cmdline-tools-temp
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses
        shell: bash

      - name: Setup Capacitor & Android platform
        run: |
          set -e
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init TradeSpark com.tradespark.app --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
        shell: bash

      - name: Ensure gradlew is executable
        run: |
          set -e
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi
        shell: bash

      - name: Build Android Debug APK
        run: |
          set -e
          export PATH=$ANDROID_SDK_ROOT/platform-tools:$PATH
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        shell: bash

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSpark-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install basic system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show environment info (debug)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version || true
          node -v || true
          npm -v || true

      - name: Install Android SDK command-line tools and required packages
        run: |
          set -euo pipefail
          echo "Using ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT"
          cd $RUNNER_TEMP
          # Download latest commandlinetools (version number may change; update URL if it fails)
          CLI_ZIP="commandlinetools.zip"
          if [ ! -f "$CLI_ZIP" ]; then
            curl -fSLo "$CLI_ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          fi
          mkdir -p cmdline-tools-temp
          unzip -q -o "$CLI_ZIP" -d cmdline-tools-temp
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          # Move the inner "cmdline-tools" contents into latest
          mv cmdline-tools-temp/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          # Ensure sdkmanager works with the correct JAVA_HOME
          echo "Installing Android SDK packages..."
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.0"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list
        shell: bash

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web App (Vite)
        run: |
          npm run build

      - name: Setup Capacitor and Android Platform
        run: |
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android --silent || true
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init TradeSpark com.tradespark.app --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          elif [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          if [ -d android ]; then
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Generated APK
        run: |
          echo "=== Generated APK Files ==="
          find . -type f -name "*.apk" -ls || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeSpark-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

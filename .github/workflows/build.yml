# Build TradeSpark APK: installs Android cmdline-tools, accepts licenses, builds APK and uploads artifacts.
# Adjust api-level / build-tools version and signing steps as needed.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up Android SDK (cmdline-tools + build-tools + platform-tools)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          components: |
            platform-tools
            build-tools;33.0.0
            cmdline-tools;latest

      - name: Ensure sdkmanager is on PATH and accept licenses
        # r0adkll/setup-android installs cmdline-tools; use that path to accept licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          elif [ -d "$ANDROID_HOME/tools/bin" ]; then
            export PATH="$ANDROID_HOME/tools/bin:$PATH"
          fi
          yes | sdkmanager --licenses

      - name: Print Android SDK info
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          sdkmanager --version || true
          adb --version || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        # If you have signing configured with secrets, run the signed assembleRelease instead.
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tradespark-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ১. কোড চেকআউট করা
    - name: Checkout repository
      uses: actions/checkout@v4

    # ২. Node.js সেটআপ করা
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # ৩. প্রজেক্টের ডিপেন্ডেন্সি ইনস্টল করা
    - name: Install dependencies
      run: npm install

    # ৪. ওয়েব অ্যাপ বিল্ড করা (dist ফোল্ডার তৈরি)
    - name: Build Web App
      run: npm run build

    # ৫. Capacitor ইনস্টল করা
    - name: Install Capacitor
      run: npm install @capacitor/core @capacitor/cli @capacitor/android

    # ৬. Capacitor কনফিগারেশন তৈরি (যদি না থাকে)
    - name: Init Capacitor Config
      run: |
        if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
          npx cap init TradeSpark com.tradespark.app --web-dir dist --yes
        fi

    # ৭. অ্যান্ড্রয়েড প্ল্যাটফর্ম যোগ করা (যদি না থাকে)
    - name: Add Android Platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    # ৮. ক্যাপাসিটর সিঙ্ক করা
    - name: Sync Capacitor Android
      run: npx cap sync android

    # ৯. Java JDK 17 সেটআপ করা
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ১০. Gradle দিয়ে Debug APK তৈরি করা
    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # ১১. APK ফাইলটি আর্টিক্যাক্ট হিসেবে আপলোড করা
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
